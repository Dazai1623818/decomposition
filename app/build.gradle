plugins {
    id 'application'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'dev.roanh.cpqnativeindex:cpq-native-index:1.0'
    implementation 'dev.roanh.gmark:gmark:2.1'

    testImplementation("org.junit.jupiter:junit-jupiter:5.12.0")
    testImplementation("org.junit.platform:junit-platform-launcher")
    testImplementation("com.google.code.gson:gson:2.11.0")
}

application {
    mainClass = 'evaluator.cli.Main'
}

distributions {
    main {
        contents {
            from('lib') {
                into 'lib'
            }
        }
    }
}

tasks.test {
    useJUnitPlatform()
    systemProperties System.getProperties()
    maxHeapSize = "32g"
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('runCompareFile', JavaExec) {
    group = 'application'
    description = 'Runs per-query, per-method comparison over a queries file.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'evaluator.cli.Main'
    doFirst {
        def current = args == null ? [] : new ArrayList<>(args)
        if (current.isEmpty()) {
            args = ['compare-file']
        } else if (current[0] != 'compare-file') {
            current.add(0, 'compare-file')
            args = current
        }
    }
}

tasks.register('runTopologyBuilder', JavaExec) {
    group = 'application'
    description = 'Builds topology-bench workloads with unique validated label injections.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'evaluator.tools.TopologyDiverseWorkloadBuilder'
}

tasks.register('runTopologyMerge', JavaExec) {
    group = 'application'
    description = 'Merges sharded topology-bench workload outputs.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'evaluator.tools.TopologyDiverseWorkloadMerger'
}

tasks.register('runMechanismProbe', JavaExec) {
    group = 'application'
    description = 'Runs the thesis mechanism probe over selected archived cases.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'evaluator.bench.MechanismProbeMain'
}
