rootProject.name = "enumerator"

def gmarkDir = file("../../gmark/gMark")
def cpqIndexDir = file("local/CPQ-native-index-fork/CPQ-native Index")

if (gmarkDir.exists()) {
    includeBuild(gmarkDir) {
        dependencySubstitution {
            substitute(module("dev.roanh.gmark:gmark")).using(project(":"))
        }
    }
}

if (cpqIndexDir.exists()) {
    includeBuild(cpqIndexDir) {
        dependencySubstitution {
            substitute(module("dev.roanh.cpqnativeindex:cpq-native-index")).using(project(":"))
        }
    }
}
